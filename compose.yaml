# PRODUCTION. `docker compose up -d` on a clean checkout builds the app image, starts PostgreSQL on a named volume and the app once the
# database is healthy; the app applies the migrations on start (under an advisory lock). Nothing else to do except the settings
# in .env (cp .env.example .env) and the first account (`make prod-user`, docs/operations.md, "First start").
# Development uses compose.dev.yaml (the Makefile passes it); do not mix the two projects: the production project is named bcm.
name: bcm
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: bcm
      POSTGRES_DB: bcm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env and set a long random password (openssl rand -hex 24)}"
    # No ports: the database is reachable only from the app on the compose network.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcm -d bcm"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
  app:
    build: .
    image: bcm:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # --- Active: what production needs. ---
      # The password goes into a URL: use only letters and digits (openssl rand -hex 24).
      DATABASE_URL: "postgres://bcm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}@postgres:5432/bcm?sslmode=disable"
      APP_ENV: production
      # Secure session/theme/glossary cookies and HSTS: this expects HTTPS in front (a TLS-terminating reverse proxy), where true is the
      # setting. The server refuses to start in production with SECURE_COOKIES=false unless ALLOW_INSECURE_COOKIES=true.
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      # --- Every other variable the server reads, with its default. Commented: nothing extra is applied. To change one, uncomment
      # --- its line (the ${...} form takes the value from .env, or the default after :-). cmd/server/envdocs_test.go (make check-env-docs)
      # --- fails when the server gains a variable that is not listed here, in compose.dev.yaml and in .env.example.
      # PORT: 8080                                   # port the server listens on inside the container (change APP_PORT for the host side)
      # ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-false}   # true: let production start with SECURE_COOKIES=false (plain http, private network)
      # TRUST_PROXY: ${TRUST_PROXY:-false}           # true only behind a reverse proxy that sets X-Forwarded-For; login attempts are counted per client
      # CSP_MODE: ${CSP_MODE:-report}                # off | report | enforce, Content-Security-Policy (docs/security-and-risks.md)
      # MIGRATE_ON_START: ${MIGRATE_ON_START:-true}  # false: refuse to start on a database that is behind; run `docker compose run --rm app migrate` first
      # MAX_CACHED_RULESETS: ${MAX_CACHED_RULESETS:-16}   # parsed rule sets kept in memory (a few MB each), least recently used dropped; at least 1
      # REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}    # a request that works longer is cancelled (queries stop, answer 503); 0 = no limit; the live stream is exempt
      # RULES_BUILD_TIMEOUT: ${RULES_BUILD_TIMEOUT:-60s}   # deadline of building a parsed rule set from its three files (a parser stuck on a hostile upload); at least 1s
      # APP_TIMEZONE: ${APP_TIMEZONE:-}              # IANA zone for visitors with no account zone and no browser zone (UTC when empty)
      # STATIC_MAX_AGE: ${STATIC_MAX_AGE:-0s}        # Cache-Control lifetime of static files (no-cache when 0)
      # STYLEGUIDE: ${STYLEGUIDE:-false}             # serve /styleguide and the development marks (development only; leave off in production)
      # PERF_TRACE: ${PERF_TRACE:-false}             # Server-Timing header with time and database statements (measuring aid, development only; leave off in production)
    # The image writes nothing to disk: lock it down.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Published on the host's loopback by default (the reverse proxy runs there); APP_BIND=0.0.0.0 to listen on every interface.
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"]
volumes:
  pgdata:
